version: 2
updates:
  # Check npm dependencies for version updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "patch"
    # Dependabot waits three days by default before it opens a pull request
    # for a new version. Seven days gives a fresh release more time to settle.
    cooldown:
      default-days: 7

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "patch"
    cooldown:
      default-days: 7
